name: Android validation
on:
  push:
    branches: [main, 'codex/**']
    paths: ['android-webview/**', 'replica/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android-webview/**', 'replica/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node --check replica/app.js
      - run: node --check replica/planner.js
      - run: node scripts/test-goal-core.cjs
      - run: gradle -p android-webview --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android-webview/app/build/outputs/apk/debug/*.apk
            android-webview/app/build/outputs/apk/release/*.apk
            android-webview/app/build/reports/

